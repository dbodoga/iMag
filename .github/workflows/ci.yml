name: Build and test iMag
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: imag
          POSTGRES_USER: imag
          POSTGRES_PASSWORD: imag_local_dev
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U imag -d imag"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - name: Backend integration tests
        run: dotnet test Backend/iMag.Tests --configuration Release --verbosity minimal
      - name: Install frontend
        working-directory: Frontend
        run: npm ci
      - name: Frontend tests and build
        working-directory: Frontend
        run: |
          npm test
          npm run build
      - name: Install Chromium
        working-directory: Frontend
        run: npx playwright install --with-deps chromium
      - name: Start API
        run: |
          dotnet run --no-build --configuration Release --project Backend/iMag.Api > /tmp/imag-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:5188/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/imag-api.log
          exit 1
      - name: Browser test
        working-directory: Frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: Frontend/test-results/
