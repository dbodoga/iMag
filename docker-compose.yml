name: imag
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: imag
      POSTGRES_USER: imag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imag_local_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - imag_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imag -d imag"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  imag_data:
